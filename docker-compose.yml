services:
  mysql:
    image: mysql:8.4
    container_name: qiniu-challenge-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: qiniu_challenge
      MYSQL_USER: qiniu
      MYSQL_PASSWORD: qiniu_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: qiniu-challenge-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: qiniu-challenge-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql-data:
