services:
  mysql:
    image: mysql:8.4
    container_name: qiniu-challenge-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: qiniu_challenge
      MYSQL_USER: qiniu
      MYSQL_PASSWORD: qiniu_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: qiniu-challenge-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      TZ: Asia/Shanghai
      SPRING_FLYWAY_LOCATIONS: filesystem:/app/db/migration
    volumes:
      - ./.env:/app/.env
      - ./db/:/app/db/
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: qiniu-challenge-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:8080
    depends_on:
      - backend
  
  nginx:
    image: nginx:alpine
    container_name: qiniu-challenge-nginx
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql-data:
