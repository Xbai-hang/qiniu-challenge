spring:
  application:
    name: qiniu-challenge-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/qiniu_challenge?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  version: 0.1.0
  timezone: Asia/Shanghai
