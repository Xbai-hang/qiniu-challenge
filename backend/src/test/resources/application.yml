spring:
  datasource:
    url: jdbc:h2:mem:qiniu_challenge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    enabled: false
  sql:
    init:
      mode: always

app:
  version: 0.1.0
  timezone: Asia/Shanghai
  security:
    jwt-secret: test-secret-with-enough-length
    access-token-ttl-seconds: 86400
  ai:
    provider: mock
  speech:
    provider: mock
  tts:
    provider: mock
